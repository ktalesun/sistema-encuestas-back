# Jenkins en un contenedor, con volumen para conservar la configuración.
#   cd jenkins && docker compose up -d --build
#   docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    # root para poder usar /var/run/docker.sock (solución para entorno local de desarrollo).
    user: root
    ports:
      - '8080:8080'     # interfaz web
      - '50000:50000'   # agentes remotos
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
